# Portable example only. Edit the gateway and enable your source in books.json.
# Credentials stay in environment variables. Paths are relative to this file.
[source]
books_file = "books.json"

[paths]
corpus = "corpus"
staging = "staging"
state = "state"
web = "web"
# Completed sync cleans successful copies; failed Markdown/images/reports remain.
results = "sync-results"
# Tool-owned successful OCR cache; never inspect its layout from dogpdkb.
ocr_cache = "ocr-cache"
# Optional explicit mdcompare-body-recovery-1 marker repairs; no automatic rescue.
# Frozen once per run with byte witnesses; paths resolve relative to this config.
# body_recovery = "body-recovery.json"

[ocr]
# Default LLM uses OpenAI Pi OAuth; set mode = "paddle" to opt in to Paddle.
# mode = "llm"
# OCR request limit for the whole batch. Omit for unlimited; 0 sends nothing new.
# request_budget = 20
# Admission deadline. In-flight calls retain tool-owned timeouts.
budget_seconds = 1800

[semantic_score]
# Explicit maximum model requests per apply/sync run. 0 keeps comparison offline.
request_budget = 0
# model = "openai/gpt-6.1-terra"

[skylark]
mcp_url = "https://example.invalid/mcp"
proxy_bin = "utoo-proxy"

[tools]
mdcompare = "mdcompare"
mdocr = "mdocr"
graphify = "graphify"
skylark = "skylark"

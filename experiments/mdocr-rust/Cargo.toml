[package]
name = "mdocr-rust-experiment"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "mdocr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
html5ever = "0.40.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"] }
merman-core = { version = "=0.11.0", default-features = false, features = ["all-diagrams"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8.23"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

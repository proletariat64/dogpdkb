[package]
name = "mdocr-rust-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "mdocr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
merman-core = { version = "=0.11.0", default-features = false, features = ["all-diagrams"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

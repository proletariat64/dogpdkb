[package]
name = "mdcompare-rust-experiment"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mdcompare"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = "1"
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

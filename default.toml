# Default project configuration. --config selects a replacement TOML file.
# Paths are relative to this file; credentials belong in environment variables.
[source]
books_file = "skylark_books/roots.json"

[paths]
corpus = "graphify_flatten_ready"
staging = "wash"
state = "skylark_books/state"
web = "web-output"
# Completed sync cleans successful temporary copies; failed inputs/reports remain.
# Durable versions and necessary latest inputs live under state, outside wash.
results = "sync-results"
# Tool-owned successful OCR cache; dogpdkb does not inspect its layout.
ocr_cache = "ocr-cache"
# Optional explicit mdcompare-body-recovery-1 marker repairs; no automatic rescue.
# Frozen once per run with byte witnesses; paths resolve relative to this config.
# body_recovery = "body-recovery.json"
# graph_dir defaults to <selected corpus>/graphify-out

[tools]
mdcompare = "mdcompare"
mdocr = "mdocr"
# Use the original Graphify extract CLI and its native manifest/cache.
graphify = "graphify"
# Require the standalone listing/export CLI; may be an argv array, for example
# ["node", "/opt/pi-skylark/dist/cli.mjs"].
skylark = "skylark"

[semantic_score]
# Score eligible CHANGED evidence via Pi OAuth; omit the cap to score all eligible changes.
model = "openai/gpt-6.1-terra"
# request_budget = 0 # Disable model scoring for an offline run.

[graphify]
# Estimated input tokens per chunk, not a spending cap.
token_budget = 5500

[ocr]
# Default LLM uses OpenAI Pi OAuth; set mode = "paddle" to opt in to Paddle.
mode = "llm"
# OCR request limit for the whole batch. Omit for unlimited; 0 sends nothing new.
# request_budget = 20
# Admission deadline. In-flight calls retain tool-owned timeouts.
budget_seconds = 7200

[skylark]
mcp_url = "https://mcpgwoffice-prod.alipay.com/mcpgw/v1/shttpproxy/message/MAIN_CHAIR_mcp.ant.faas.skylarkmcpserver.skylarkmcpserver"
proxy_bin = "~/.utoo-proxy/utoo-proxy"
timeout_seconds = 60

[web]
community_limit = 120


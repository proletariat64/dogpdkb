[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdocr"
version = "0.1.0"
description = "Prepare and OCR images referenced by Markdown"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "Pillow>=9",
]

[project.scripts]
mdocr = "mdocr.cli:main"

[tool.setuptools.packages.find]
include = ["mdocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

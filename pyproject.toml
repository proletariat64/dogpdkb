[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogpdkb"
version = "0.2.5"
description = "Yuque knowledge synchronization, graph updates and Web publication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "Pillow>=9",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dogpdkb = "dogpdkb.cli:main"
mdocr = "mdocr.cli:main"
mdcompare = "mdcompare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dogpdkb*", "mdocr*", "mdcompare*"]
namespaces = false

[tool.setuptools.package-data]
dogpdkb = ["resources/*.toml", "resources/*.json", "resources/help/*.txt"]
mdcompare = ["help/*.txt"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Bootstrap locked development environment
        run: make bootstrap PYTHON="$(uv python find --managed-python)"
      - name: Run quality gate
        run: make check
      - name: Build and verify isolated platform installation
        # Fresh runners may have wheels but no index metadata from locked sync.
        # Local release checks stay offline; CI may fill its disposable cache.
        env:
          UV_OFFLINE: "0"
        run: make smoke

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Run Rust quality gate
        run: make checkr
      - name: Build and verify standalone Rust executable
        run: make smoker
